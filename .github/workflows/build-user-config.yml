name: Reusable user config build

on:
  workflow_call:
    inputs:
      build_matrix_path:
        default: "build.yaml"
        required: false
        type: string
      config_path:
        default: "config"
        required: false
        type: string
      fallback_binary:
        default: "bin"
        required: false
        type: string
      archive_name:
        default: "firmware"
        required: false
        type: string

jobs:
  matrix:
    runs-on: ubuntu-22.04
    outputs:
      build_matrix: ${{ env.build_matrix }}
      has_valid_build_matrix: ${{ steps.fetch.outputs.has_valid_build_matrix }}

    steps:
      - uses: actions/checkout@v4

      - id: fetch
        run: |
          matrix_content=$(yq -oj -I0 '${{ inputs.build_matrix_path }}')

          if [ -z "$matrix_content" ] || [ "$matrix_content" = "null" ]; then
            echo "has_valid_build_matrix=false" >> $GITHUB_OUTPUT
          else
            echo "build_matrix=$matrix_content" >> $GITHUB_ENV
            echo "has_valid_build_matrix=true" >> $GITHUB_OUTPUT
          fi

  build:
    runs-on: ubuntu-latest
    needs: matrix
    if: needs.matrix.outputs.has_valid_build_matrix == 'true'

    container:
      image: zmkfirmware/zmk-build-arm:stable

    strategy:
      matrix: ${{ fromJson(needs.matrix.outputs.build_matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Prepare dirs
        run: |
          echo "build_dir=$(mktemp -d)" >> $GITHUB_ENV

      # ★ここが今回の重要修正
      - name: Copy config + build.yaml
        run: |
          mkdir -p "${{ env.build_dir }}/config"
          cp -R config/* "${{ env.build_dir }}/config/"
          cp build.yaml "${{ env.build_dir }}/"

      - name: West Init
        working-directory: ${{ env.build_dir }}
        run: west init -l config

      - name: West Update
        working-directory: ${{ env.build_dir }}
        run: west update

      - name: West Zephyr export
        working-directory: ${{ env.build_dir }}
        run: west zephyr-export

      - name: Build
        working-directory: ${{ env.build_dir }}
        run: |
          west build -s zmk/app -d build -b "${{ matrix.board }}" -- \
            -DZMK_CONFIG=${{ env.build_dir }}/config \
            -DSHIELD="${{ matrix.shield }}" \
            ${{ matrix.cmake-args }}

      # ★ここがhex/uf2両対応
      - name: Rename artifacts
        run: |
          mkdir -p "${{ env.build_dir }}/artifacts"

          echo "==== FILE LIST ===="
          find "${{ env.build_dir }}/build" -type f

          # UF2
          if [ -f "${{ env.build_dir }}/build/zephyr/zmk.uf2" ]; then
            cp "${{ env.build_dir }}/build/zephyr/zmk.uf2" \
               "${{ env.build_dir }}/artifacts/${{ matrix.artifact-name }}.uf2"
          fi

          # HEX
          if [ -f "${{ env.build_dir }}/build/zephyr/zmk.hex" ]; then
            cp "${{ env.build_dir }}/build/zephyr/zmk.hex" \
               "${{ env.build_dir }}/artifacts/${{ matrix.artifact-name }}.hex"
          elif [ -f "${{ env.build_dir }}/build/zephyr/zephyr.hex" ]; then
            cp "${{ env.build_dir }}/build/zephyr/zephyr.hex" \
               "${{ env.build_dir }}/artifacts/${{ matrix.artifact-name }}.hex"
          fi

          # BIN fallback
          if [ -f "${{ env.build_dir }}/build/zephyr/zmk.${{ inputs.fallback_binary }}" ]; then
            cp "${{ env.build_dir }}/build/zephyr/zmk.${{ inputs.fallback_binary }}" \
               "${{ env.build_dir }}/artifacts/${{ matrix.artifact-name }}.${{ inputs.fallback_binary }}"
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.artifact-name }}
          path: ${{ env.build_dir }}/artifacts

  merge:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Merge
        uses: actions/upload-artifact/merge@v4
        with:
          name: ${{ inputs.archive_name }}
          pattern: artifact-*